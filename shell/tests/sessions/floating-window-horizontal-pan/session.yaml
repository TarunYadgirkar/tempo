name: floating-window-horizontal-pan
description: |
  An anchored panel pinned to a stationary detected plane must remain
  visually over the same real-world feature when the camera translates
  horizontally.  Authored as a regression for the RAW-vs-SCENE frame
  mismatch in anchors.c plane_to_matrix() (fixed in
  plans/2026-05-27-fix-floating-window-parallax/).  Before the fix:
  panel pixel drifts >5px as the camera pans 0.5m laterally with
  origin_rot != identity.  After the fix: panel pixel stays within
  5px of the expected scene-frame projection.

tags:
  - expected-pass: true
  - subsystem: wxrd
  - feature: world-anchored-panels

input:
  type: synthetic
  script: |
    # t=0: camera at ARKit origin, tilted 10deg about Y so origin_rot
    # is non-identity once captured.  quat(axis=(0,1,0), angle=10deg)
    # = (0, 0.0872, 0, 0.9962).
    pose pos=(0.0, 0.0, 0.0)  rot=(0.0, 0.0872, 0.0, 0.9962) at_ts=0ms
    # detected plane: 1m in front, horizontal, known UUID.
    plane uuid=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          center=(0.0, -0.3, -1.0) normal=(0.0, 1.0, 0.0) \
          extent=(0.6, 0.6) at_ts=50ms
    # client pins a window to that plane via SPATIAL_ANCHOR_UUID.
    # setup_env mutates the harness's shell environment; subsequent
    # spawn_client verbs inherit it (matching how wxrd already parses
    # SPATIAL_ANCHOR_UUID off the client's connection env).
    setup_env SPATIAL_ANCHOR_UUID=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    spawn_client name=test_panel at_ts=200ms
    # camera holds rotation, pans +0.5m along ARKit +X over 2s.
    pose pos=(0.125, 0.0, 0.0) rot=(0.0, 0.0872, 0.0, 0.9962) at_ts=750ms
    pose pos=(0.250, 0.0, 0.0) rot=(0.0, 0.0872, 0.0, 0.9962) at_ts=1250ms
    pose pos=(0.375, 0.0, 0.0) rot=(0.0, 0.0872, 0.0, 0.9962) at_ts=1750ms
    pose pos=(0.500, 0.0, 0.0) rot=(0.0, 0.0872, 0.0, 0.9962) at_ts=2250ms

setup:
  - rm -f /tmp/spatos.log

expectations:
  # The panel must project to the same screen-space ray to the real
  # plane feature at every pose along the pan.  Compute the expected
  # screen-space (sx, sy) by transforming the plane center through the
  # view matrix at each pose (see main.c:820-889 for the view-matrix
  # derivation; same math here), projecting through the fixed
  # projection used by g3k.  Tolerance: 5px in each axis.
  - kind: anchored-window-screen-position
    name: test_panel
    at_ts: 750ms
    expected_sx_sy: from_view_at_pose   # transcript helper computes this
    tolerance_px: 5
  - kind: anchored-window-screen-position
    name: test_panel
    at_ts: 1250ms
    expected_sx_sy: from_view_at_pose
    tolerance_px: 5
  - kind: anchored-window-screen-position
    name: test_panel
    at_ts: 1750ms
    expected_sx_sy: from_view_at_pose
    tolerance_px: 5
  - kind: anchored-window-screen-position
    name: test_panel
    at_ts: 2250ms
    expected_sx_sy: from_view_at_pose
    tolerance_px: 5

teardown:
  - pkill -9 wxrd || true
  - pkill -9 monado-service || true
