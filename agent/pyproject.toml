[project]
name = "tempo"
version = "0.1.0"
description = "Room-aware spatial agent for the Tempo shell"
authors = [
    { name = "Tarun Yadgirkar", email = "tyadgirkar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.23.0",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "sounddevice>=0.5.6",
    "speechbrain>=1.1.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

[project.scripts]
tempo = "tempo.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
